<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUSH: The Frequency Trap (3D Edition)</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",monospace;color:#7fa592}
#gl,#map{position:fixed;inset:0;width:100%;height:100%}
#map{display:none;pointer-events:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#ov{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#00ff66;font-size:22px;z-index:9;padding:20px;text-shadow:0 0 10px currentColor}
#ov small{color:#7fa592;font-size:14px;margin-top:14px;max-width:600px;text-shadow:none;line-height:1.5}
#ov button{margin-top:22px;background:none;color:inherit;border:2px solid currentColor;padding:12px 34px;font:inherit;font-size:18px;cursor:pointer;box-shadow:0 0 14px currentColor}
#top{position:absolute;top:12px;left:14px;font-size:14px;color:#00f3ff;line-height:1.6;text-shadow:0 0 8px #00f3ff}
#toast{position:absolute;top:28%;width:100%;text-align:center;font-size:24px;color:#00ff66;text-shadow:0 0 10px #00ff66;opacity:0}
#cross{position:absolute;top:50%;left:50%;width:4px;height:4px;margin:-2px;background:#00ff6699;border-radius:50%}
#hide{position:absolute;inset:0;display:none;text-align:center;color:#ff2a3d;font-size:34px;padding-top:16%;box-sizing:border-box;text-shadow:0 0 12px #f00;background:linear-gradient(#000 0 46%,transparent 46% 54%,#000 54%)}
#hide small{display:block;font-size:16px;color:#ff6a78}
#pad{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;background:#000c;border:2px solid #ffd23a;color:#ffd23a;padding:18px 30px;text-align:center;font-size:16px}
#pad b{display:block;font-size:40px;color:#00ff66;letter-spacing:8px;margin:8px 0}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#red{position:absolute;inset:0;background:#f00;opacity:0}
/* ---- retro-futuristic terminal skin ---- */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.22) 2px 3px);box-shadow:inset 0 0 130px rgba(0,0,0,.7)}
#top{background:rgba(2,14,10,.62);border:1px solid #1f6a4c;border-left:3px solid #00ff66;padding:8px 14px;box-shadow:0 0 14px rgba(0,255,102,.15)}
#meter{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:min(660px,88vw);box-sizing:border-box;padding:8px 12px;background:rgba(2,14,10,.68);border:1px solid #1f6a4c;font-size:12px;letter-spacing:1px;text-shadow:0 0 6px currentColor}
#mrow{display:flex;justify-content:space-between;margin-bottom:6px}

#segs{display:flex;gap:2px}
#segs i{flex:1;height:17px;box-sizing:border-box;background:#0f1a14;border-bottom:3px solid transparent}
#thr{margin-top:6px;font-size:11px;color:#7fa592;text-align:center;text-shadow:none}
#prompt{position:absolute;top:58%;left:50%;transform:translateX(-50%);padding:8px 20px;border:1px solid #00ff66;background:rgba(2,14,10,.72);color:#00ff66;font-size:18px;letter-spacing:2px;text-shadow:0 0 12px #00ff66;box-shadow:0 0 18px rgba(0,255,102,.35);opacity:0;white-space:nowrap}
#toast{text-shadow:0 0 14px #00ff66;letter-spacing:2px}
#pad{background:rgba(2,14,10,.9);box-shadow:0 0 24px rgba(255,210,58,.3);text-shadow:0 0 8px currentColor}
#ov{background:radial-gradient(ellipse at center,#04120c 0,#000 75%);letter-spacing:2px}
#ov button{background:rgba(0,255,102,.08)}
/* ---- intro menu + floating prompts ---- */
#logo{font-size:34px;letter-spacing:6px;text-shadow:0 0 18px #00ff66}
#story{max-width:700px;margin:22px 0 14px;font-size:16px;line-height:1.7;text-align:left;color:#9fe8c0;min-height:136px;text-shadow:none;border-left:3px solid #00ff66;padding:6px 14px;background:rgba(0,20,10,.5)}
#ov .dbtn{display:block;width:min(560px,90vw);margin:8px auto;padding:10px 16px;background:rgba(0,0,0,.6);border:2px solid currentColor;font:inherit;font-size:18px;cursor:pointer;box-shadow:0 0 14px currentColor;text-shadow:0 0 10px currentColor}
#ov .dbtn span{display:block;font-size:12px;color:#7fa592;text-shadow:none;margin-top:4px}
#ov .dbtn:hover{background:rgba(255,255,255,.1)}
#prompt{top:0;left:0;transform:translate(-50%,-100%);transition:opacity .12s}
</style>
</head>
<body>
<canvas id="gl"></canvas><canvas id="map"></canvas>
<div id="hud">
  <div id="cross"></div><div id="top"></div><div id="toast"></div>
  <div id="prompt"></div><div id="hide"></div><div id="pad"></div><div id="flash"></div><div id="red"></div>
  <div id="meter"><div id="mrow"><span id="db">SOUND</span><span id="mapkey">[M] MAP</span><span id="lab">SILENT</span></div>
    <div id="segs"></div><div id="thr"></div></div>
</div>
<div id="ov"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===================== CONFIG =====================
const $ = id => document.getElementById(id);
const T = 4, H = 3.2, CW = 10, CH = 8, GW = CW * 2 + 1, GH = CH * 2 + 1, D4 = [[1,0],[-1,0],[0,1],[0,-1]];
const LEVELS = [ // each sector toggles traps, lighting and objectives from this table
  { name: 'SECTOR A', sub: 'QUIET DARKNESS', lasers: 0, glass: 0, lockers: 3, m: .9 },
  { name: 'SECTOR B', sub: 'LASERS & GLASS: USE BOLTS', lasers: 4, glass: 10, lockers: 4, m: 1, guard: true },
  { name: 'SECTOR C', sub: 'POWER BLACKOUT', lasers: 2, glass: 5, lockers: 5, m: 1.05, dark: true, term: true },
  { name: 'SECTOR D', sub: 'EXTRACTION', lasers: 3, glass: 4, lockers: 3, m: 1.1 }
];

// ===================== STATE =====================
let st = 'menu'; // menu, boot, calib, ready, play, win, lose
let actx, an, buf, micOK = false, micErr = '', level = 0, stepN = 0, glassN = 0, eff = 0, ns = 0, prevN = 0;
let base = .005, warn = .02, breach = .04, calT = 0, calS = 0, calN = 0, gate = 0, clk = 0;
let flashT = 0, flashW = 0, alarmT = 0, alertCD = 0, laserCD = 0, boltCD = 0, glassTimer = 0, catchImm = 0, toastT = 0;
let lvl = 1, cfg = LEVELS[0], cards = 0, got = 0, grid = [], seen = [], showMap = false, loseMsg = '';
let player = { x: 0, z: 0, yaw: 0, pitch: 0 }, mon, cores = [], lasers = [], glass = {}, lockers = [], bolts = [];
let term = null, code = [], known = [], solved = true, keypad = null, elev = { on: false, t: 0 }, frenzy = false, hide = null;
let world, exitP = { x: 0, z: 0 }, doorL, doorR, lamps = [], pending = null;
const keys = {};

// ===================== AUDIO =====================
const MIC_GAIN = 4;            // GainNode multiplier in front of the analyser: whispers, soft gasps and chair scrapes register
let disp = 0, hudT = 0, calPk = 0; // smoothed level shown on the HUD; calibration peak
const DIFFS = { // noise thresholds are functions of the calibrated floor; spd scales every monster speed; hide = locker window (s)
  low:  { tag: 'RECRUIT',  warn: b => b * 2.8,         breach: b => b * 5.0,         spd: .8,  hide: 5 },
  med:  { tag: 'STANDARD', warn: b => b * 2.0 + .012, breach: b => b * 3.5 + .03,   spd: 1,   hide: 5 },
  high: { tag: 'HARDCORE', warn: b => b * 1.3,         breach: b => b * 2.2,         spd: 1.3, hide: 3.5 }
};
let dif = DIFFS.med;
/** Request the mic; any failure (denied, missing, insecure page) falls back to keyboard noise (hold N). */
async function initAudio() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('mic API unavailable (use https or localhost)');
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    actx = new (window.AudioContext || window.webkitAudioContext)();
    an = actx.createAnalyser(); an.fftSize = 2048; const gn = actx.createGain(); gn.gain.value = MIC_GAIN;
    actx.createMediaStreamSource(s).connect(gn); gn.connect(an); // mic -> gain -> analyser (not routed to speakers)
    buf = new Float32Array(an.fftSize); micOK = true; actx.resume();
  } catch (e) {
    micOK = false; micErr = (e && (e.name || e.message)) || 'unknown error';
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
  }
  st = 'calib';
}
/** RMS of the gained mic signal (DC offset removed). Attack is instant so a breach is caught the frame it happens;
 *  release is a time-based exponential so the level doesn't jitter. */
function readMic(dt) {
  let raw = 0;
  if (micOK) {
    an.getFloatTimeDomainData(buf); let m = 0, sq = 0;
    for (let i = 0; i < buf.length; i++) m += buf[i]; m /= buf.length;
    for (let i = 0; i < buf.length; i++) { const d = buf[i] - m; sq += d * d; }
    raw = Math.sqrt(sq / buf.length);
  } else if (keys.KeyN) raw = breach * 1.4;
  if (gate > 0) raw = 0; // ignore the game's own speaker sounds
  level = raw > level ? raw : level + (raw - level) * (1 - Math.exp(-dt / .16));
  return raw;
}
function tone(f0, f1, dur, type, vol, delay = 0) {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .02);
}
function crackle(dur, vol, hp, delay = 0) {
  if (!actx || actx.state !== 'running') return;
  const n = actx.sampleRate * dur | 0, b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = b; f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start(actx.currentTime + delay);
}
const screech = () => { tone(2400, 900, .55, 'sawtooth', .16); tone(3100, 1300, .55, 'square', .06, .04); gate = .7; };
const siren = () => { for (const d of [0, .24]) tone(1000, 980, .14, 'square', .13, d); gate = .6; };
const crunch = () => { crackle(.1, .5, 1500); crackle(.08, .35, 3200, .07); gate = .25; };
const clang = () => { tone(1500, 1200, .4, 'triangle', .28); tone(2300, 2000, .3, 'sine', .12); gate = .5; };
const zap = () => { tone(140, 50, .7, 'sawtooth', .2); crackle(.6, .4, 700); gate = .8; };
const whine = () => { tone(300, 520, 1.2, 'sawtooth', .07); gate = .3; }; // elevator mechanical whine

// ===================== THREE.JS SETUP =====================
if (typeof THREE === 'undefined') {
  $('ov').innerHTML = 'THREE.JS FAILED TO LOAD<small>This game loads Three.js from cdnjs. Check your internet connection and reload.</small>';
  throw new Error('THREE missing');
}
let R;
try { R = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true }); }
catch (e) { $('ov').innerHTML = 'WEBGL UNAVAILABLE<small>Enable hardware acceleration or use a WebGL-capable browser.</small>'; throw e; }
R.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(70, 1, .1, 60);
scene.add(cam);
const amb = new THREE.AmbientLight(0x8090b8, 1.1); scene.add(amb);
const flash = new THREE.SpotLight(0xfff2cc, 3.4, 40, .9, .6, 1); // flashlight rides on the camera
const ftarget = new THREE.Object3D(); ftarget.position.set(0, 0, -1);
cam.add(flash, ftarget); flash.target = ftarget;
function resize() { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); $('map').width = innerWidth; $('map').height = innerHeight; }
addEventListener('resize', resize); resize();

function mkTex(rep, fn) {
  const c = document.createElement('canvas'); c.width = c.height = 128; fn(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); return t;
}
const grain = x => { for (let i = 0; i < 1400; i++) { const v = Math.random() * 60 | 0; x.fillStyle = `rgba(${v},${v},${v},.25)`; x.fillRect(Math.random() * 128, Math.random() * 128, 2, 2); } };
const wallM = new THREE.MeshStandardMaterial({ map: mkTex(1, x => { x.fillStyle = '#565b61'; x.fillRect(0, 0, 128, 128); grain(x); x.strokeStyle = '#2b2f33'; x.strokeRect(0, 0, 128, 128); }), roughness: .9 });
const floorM = new THREE.MeshStandardMaterial({ map: mkTex(GW * 2, x => { x.fillStyle = '#34383c'; x.fillRect(0, 0, 128, 128); grain(x); x.strokeStyle = '#22262a'; x.strokeRect(0, 0, 128, 128); }), roughness: .95 });
const ceilM = new THREE.MeshStandardMaterial({ color: 0x202428, roughness: 1 });
const metalM = new THREE.MeshStandardMaterial({ color: 0x6b8196, metalness: .6, roughness: .45 });
const glassM = new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, map: mkTex(1, x => {
  for (let i = 0; i < 40; i++) { x.fillStyle = Math.random() < .5 ? 'rgba(210,240,250,.85)' : 'rgba(120,200,225,.6)'; x.beginPath();
    const a = Math.random() * 128, b = Math.random() * 128; x.moveTo(a, b); x.lineTo(a + 4 + Math.random() * 14, b + Math.random() * 8); x.lineTo(a + Math.random() * 8, b + 4 + Math.random() * 14); x.fill(); } }) });
const beamM = new THREE.MeshBasicMaterial({ color: 0xff2030 });

// monster: red glowing creature with its own light
const monG = new THREE.Group();
const monBody = new THREE.Mesh(new THREE.SphereGeometry(.65, 16, 12), new THREE.MeshStandardMaterial({ color: 0xff1a2a, emissive: 0xff0018, emissiveIntensity: 1.2 }));
monG.add(monBody);
for (const sx of [-.22, .22]) { const e = new THREE.Mesh(new THREE.SphereGeometry(.09, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff })); e.position.set(sx, .15, -.55); monG.add(e); }
monG.add(new THREE.PointLight(0xff1020, 1.6, 9));
scene.add(monG);

// ===================== MAZE LOGIC =====================
const rndCell = () => [(Math.random() * CW | 0) * 2 + 1, (Math.random() * CH | 0) * 2 + 1];
const man = (a, b, c, d) => Math.abs(a - c) + Math.abs(b - d);
function genMaze() { // recursive backtracker plus a few loops
  grid = Array.from({ length: GH }, () => Array(GW).fill(1));
  const st2 = [[0, 0]], sn = new Set(['0,0']); grid[1][1] = 0;
  while (st2.length) {
    const [cx, cy] = st2[st2.length - 1];
    const nb = D4.map(([dx, dy]) => [cx + dx, cy + dy, dx, dy]).filter(([x, y]) => x >= 0 && y >= 0 && x < CW && y < CH && !sn.has(x + ',' + y));
    if (!nb.length) { st2.pop(); continue; }
    const [nx, ny, dx, dy] = nb[Math.random() * nb.length | 0];
    sn.add(nx + ',' + ny); grid[ny * 2 + 1][nx * 2 + 1] = 0; grid[cy * 2 + 1 + dy][cx * 2 + 1 + dx] = 0; st2.push([nx, ny]);
  }
  for (let i = 0; i < 14; i++) { const x = 1 + Math.random() * (GW - 2) | 0, y = 1 + Math.random() * (GH - 2) | 0; if ((x + y) % 2) grid[y][x] = 0; }
}
function bfs(sx, sy, tx, ty) { // next tile on the shortest path
  const s0 = sy * GW + sx, prev = new Int16Array(GW * GH).fill(-2), q = [s0]; prev[s0] = -1;
  for (let i = 0; i < q.length; i++) {
    const c = q[i], x = c % GW, y = c / GW | 0; if (x === tx && y === ty) break;
    for (const [dx, dy] of D4) { const nx = x + dx, ny = y + dy; if (grid[ny][nx] || prev[ny * GW + nx] !== -2) continue; prev[ny * GW + nx] = c; q.push(ny * GW + nx); }
  }
  let c = ty * GW + tx; if (prev[c] === -2) return null;
  while (prev[c] !== -1 && prev[c] !== s0) c = prev[c];
  return [c % GW, c / GW | 0];
}
function pathLen(sx, sy, tx, ty) {
  const d = new Int16Array(GW * GH).fill(-1), q = [sy * GW + sx]; d[q[0]] = 0;
  for (let i = 0; i < q.length; i++) {
    const c = q[i], x = c % GW, y = c / GW | 0; if (x === tx && y === ty) return d[c];
    for (const [dx, dy] of D4) { const nx = x + dx, ny = y + dy; if (grid[ny][nx] || d[ny * GW + nx] >= 0) continue; d[ny * GW + nx] = d[c] + 1; q.push(ny * GW + nx); }
  }
  return 0;
}
const rndNear = (g, d) => { for (let i = 0; i < 60; i++) { const c = rndCell(); if (man(c[0], c[1], g[0], g[1]) <= d) return c; } return g; };
const solid = (x, z) => grid[z / T | 0]?.[x / T | 0] !== 0;
const blocked = (x, z) => { const r = .35; return solid(x - r, z - r) || solid(x + r, z - r) || solid(x - r, z + r) || solid(x + r, z + r) || lockers.some(l => Math.hypot(l.wx - x, l.wz - z) < .8); };
const tc = v => (v + .5) * T; // tile index -> world centre
const laserOn = l => Math.floor((clk + l.ph) / 2) % 2 === 0; // toggles every 2s
const near = (x, z, r) => Math.hypot(x - player.x, z - player.z) < r;

// ===================== LEVEL BUILD =====================
const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
function loadLevel(n) {
  lvl = n; cfg = LEVELS[n - 1]; genMaze(); showMap = false; $('map').style.display = 'none';
  seen = Array.from({ length: GH }, () => Array(GW).fill(false));
  got = 0; stepN = glassN = level = prevN = 0; flashT = alarmT = alertCD = laserCD = boltCD = 0; catchImm = 1.5;
  frenzy = false; elev = { on: false, t: 0 }; keypad = null; hide = null; term = null; bolts = []; lamps = [];
  solved = !cfg.term; code = []; known = [false, false, false]; loseMsg = 'It followed the sound.';
  player = { x: tc(1), z: tc(1), yaw: 0, pitch: 0 };
  player.yaw = grid[1][2] === 0 ? -Math.PI / 2 : Math.PI; // face the open corridor
  exitP = { x: tc(GW - 2), z: tc(GH - 2) };
  mon = { x: tc(GW - 2), z: tc(1), target: null, hunt: 0, alert: 0, heard: null, lure: null, stun: 0, stunCD: 0, guard: null };
  if (world) scene.remove(world);
  world = new THREE.Group(); scene.add(world);
  const W = GW * T, Dp = GH * T;
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(W, Dp), floorM); fl.rotation.x = -Math.PI / 2; fl.position.set(W / 2, 0, Dp / 2); world.add(fl);
  const ce = new THREE.Mesh(new THREE.PlaneGeometry(W, Dp), ceilM); ce.rotation.x = Math.PI / 2; ce.position.set(W / 2, H, Dp / 2); world.add(ce);
  const wg = new THREE.BoxGeometry(T, H, T);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    if (!grid[y][x] || !D4.some(([dx, dy]) => grid[y + dy]?.[x + dx] === 0)) continue;
    const w = new THREE.Mesh(wg, wallM); w.position.set(tc(x), H / 2, tc(y)); world.add(w);
  }
  placeTraps(); placeLockers();
  cores = [];
  if (n < 4) placeCard();
  if (cfg.term) placeTerminal();
  if (cfg.dark) for (let i = 0; i < 4; i++) { // red emergency lamps
    const [cx, cy] = rndCell(), p = new THREE.PointLight(0xff1020, 1.3, 11); p.position.set(tc(cx), H - .4, tc(cy)); world.add(p); lamps.push(p);
  }
  buildExit();
  scene.fog = cfg.dark ? new THREE.Fog(0x120004, 5, 26) : new THREE.Fog(0x03050a, 12, 52); // starts far away so hallways stay visible
  scene.background = new THREE.Color(0x000000);
  amb.color.set(cfg.dark ? 0x7a1c1c : 0x8090b8); amb.intensity = cfg.dark ? .75 : 1.1;
  toast(cfg.name + ': ' + cfg.sub, 3);
  st = 'play';
}
function startGame() { cards = 0; loadLevel(1); }

function placeTraps() {
  lasers = []; glass = {};
  const cand = [];
  for (let y = 1; y < GH - 1; y++) for (let x = 1; x < GW - 1; x++) {
    if (grid[y][x]) continue;
    const h = !grid[y][x - 1] && !grid[y][x + 1] && grid[y - 1][x] && grid[y + 1][x];
    const v = !grid[y - 1][x] && !grid[y + 1][x] && grid[y][x - 1] && grid[y][x + 1];
    if ((h || v) && man(x, y, 1, 1) > 5 && man(x, y, GW - 2, 1) > 4 && man(x, y, GW - 2, GH - 2) > 3) cand.push({ x, y, h });
  }
  cand.sort(() => Math.random() - .5);
  for (const c of cand) if (lasers.length < cfg.lasers && lasers.every(l => man(c.x, c.y, l.x, l.y) > 4)) {
    const l = { ...c, ph: Math.random() * 4, g: new THREE.Group(), bm: new THREE.Group(), pl: new THREE.PointLight(0xff2030, 1.4, 8) };
    for (const hy of [.45, 1.0, 1.55]) { const b = c.h ? box(.06, .06, T, beamM) : box(T, .06, .06, beamM); b.position.y = hy; l.bm.add(b); }
    for (const e of [-1, 1]) { const em = box(.14, .14, .14, new THREE.MeshBasicMaterial({ color: 0xaa1822 })); em.position.set(c.h ? 0 : e * (T / 2 - .08), 1, c.h ? e * (T / 2 - .08) : 0); l.g.add(em); }
    l.pl.position.y = 1.2; l.g.add(l.bm, l.pl);
    l.g.position.set(tc(c.x), 0, tc(c.y)); world.add(l.g); lasers.push(l);
  }
  let n = 0, tries = 0;
  while (n < cfg.glass && tries++ < 300) {
    const x = 1 + Math.random() * (GW - 2) | 0, y = 1 + Math.random() * (GH - 2) | 0, k = x + ',' + y;
    if (grid[y][x] || glass[k] || man(x, y, 1, 1) < 4 || lasers.some(l => l.x === x && l.y === y)) continue;

// ===================== MONSTER AI =====================
function updMon(dt) {

  tag(GW - 2, GH - 2, '#00ff66', lvl === 4 ? 'ELEVATOR' : 'EXIT');
  const px = ox + player.x / T * s, py = oy + player.z / T * s, fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw), r = s * .3;
  x.fillStyle = '#00ff66'; x.shadowColor = '#00ff66'; x.shadowBlur = 12; x.beginPath(); // player arrow shows facing
  x.moveTo(px + fx * r * 1.4, py + fz * r * 1.4); x.lineTo(px - fx * r - fz * r, py - fz * r + fx * r); x.lineTo(px - fx * r + fz * r, py - fz * r - fx * r);
  x.closePath(); x.fill(); x.shadowBlur = 0;
  x.fillStyle = '#9fdcff'; x.font = '16px "Courier New",monospace'; x.textAlign = 'left';
  x.fillText('TACTICAL FLOOR PLAN // ' + cfg.name + ' // ' + cfg.sub, 24, 30);
  x.textAlign = 'right'; x.fillText('[M] CLOSE   LIVE: GAME NOT PAUSED', c.width - 24, 30);
  x.textAlign = 'center'; x.font = '12px "Courier New",monospace'; x.fillStyle = 'rgba(159,220,255,.7)';
  x.fillText('Only explored areas are charted. The creature is not tracked.', c.width / 2, oy + GH * s + 26);
}
function hud() {
  if (st !== 'play' && st !== 'calib') return;
  const flashOn = flashT > 0 && Math.floor(clk * 12) % 2 === 0, mx = breach * 1.6;
  const col = flashOn || ns === 2 ? '#ff2a3d' : ns === 1 ? '#ffd23a' : '#00ff66';
  const dbv = v => Math.round(20 * Math.log10(Math.max(v, 1e-5)));
  const dbf = v => 20 * Math.log10(Math.max(v, 1e-5));
  const kk = 1 - Math.exp(-Math.max(0, clk - hudT) / (eff > disp ? .05 : .2)); disp += (eff - disp) * kk; hudT = clk; // fast rise, calm fall
  const lo = dbf(base * .6), hi = dbf(breach * 1.5), pos = v => Math.max(0, Math.min(1, (dbf(v) - lo) / (hi - lo))); // dB scale magnifies quiet changes
  const lit = Math.round(pos(disp) * SEGN), wi = Math.round(pos(warn) * SEGN), bi = Math.round(pos(breach) * SEGN);
  segEls.forEach((e, i) => { // green below WARN, yellow up to BREACH, red above; white tick marks the thresholds
    const c = flashOn || i >= bi ? '#ff2a3d' : i >= wi ? '#ffd23a' : '#00ff66', on = i < lit;
    e.style.background = on ? c : '#0f1a14'; e.style.boxShadow = on ? '0 0 8px ' + c : 'none';
    e.style.borderBottomColor = (i === wi || i === bi) ? '#fff' : 'transparent';
  });
  $('db').textContent = 'SOUND ' + dbv(disp) + ' dB';
  $('thr').textContent = 'WARN ' + dbv(warn) + ' dB   |   BREACH ' + dbv(breach) + ' dB   |   FLOOR ' + dbv(base) + ' dB';
  $('lab').textContent = flashOn || ns === 2 ? 'BREACH' : ns === 1 ? 'WARNING' : 'SILENT'; $('lab').style.color = col;
  $('mapkey').style.color = showMap ? '#00f3ff' : '#7fa592';
  $('red').style.opacity = flashOn ? .25 : 0; $('flash').style.opacity = flashW;
  $('toast').style.opacity = toastT > 0 ? Math.min(1, toastT) : 0;
  if (st !== 'play') return;
  $('top').innerHTML = cfg.name + ' &nbsp; ' + dif.tag + ' &nbsp; KEYCARDS ' + cards + '/3<br><span style="color:#9fb8c8;font-size:12px">' + objective() + '</span>' +
    (alarmT > 0 ? '<br><span style="color:#ff2a3d">INTRUSION ALARM</span>' : '') + (mon.stun > 0 ? '<br><span style="color:#78d8ff">MONSTER STUNNED ' + mon.stun.toFixed(1) + 's: RUN</span>' : '') +
    '<br><span style="color:#7fa592;font-size:12px">' + (boltCD > 0 ? 'BOLT RELOADING' : 'BOLT READY [SPACE]') + '</span>';
  const pi = promptInfo(), pe = $('prompt'); let vis = false; // prompt floats at the object's projected 3D position
  if (pi) {
    const v = new THREE.Vector3(pi.x, pi.y, pi.z).project(cam);
    if (v.z < 1) {
      vis = true; pe.style.left = ((v.x * .5 + .5) * innerWidth) + 'px'; pe.style.top = ((-v.y * .5 + .5) * innerHeight) + 'px';
      pe.textContent = pi.t; pe.style.color = pe.style.borderColor = pi.c; pe.style.textShadow = '0 0 12px ' + pi.c; pe.style.boxShadow = '0 0 18px ' + pi.c;
    }
  }
  pe.style.opacity = vis ? 1 : 0;
  const hd = $('hide'); hd.style.display = hide ? 'block' : 'none';
  if (hide) hd.innerHTML = (hide.leaving ? "...IT'S LEAVING" : "DON'T BREATHE") + '<small>' + hide.t.toFixed(1) + 's' + (!hide.leaving && Math.hypot(mon.x - hide.lk.wx, mon.z - hide.lk.wz) < 3.5 && Math.floor(clk * 3) % 2 ? '  ...sniff...' : '') + '</small>';
  $('map').style.display = showMap ? 'block' : 'none'; if (showMap) drawMap();
}

// ===================== INPUT / FLOW =====================
const lock = () => { try { const r = $('gl').requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (_) {} };
addEventListener('keydown', e => {
  keys[e.code] = true; if (actx && actx.state !== 'running') actx.resume();
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (st !== 'play') return;
  if (e.code === 'KeyM' && !e.repeat) showMap = !showMap; // map never pauses the game
  if (keypad) keypadKey(e);
  else if (e.code === 'KeyE' && !e.repeat) interact();
  else if (e.code === 'Space' && !e.repeat) throwBolt();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('pointerdown', () => { if (actx && actx.state !== 'running') actx.resume(); });
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== $('gl') || st !== 'play' || hide) return;
  player.yaw -= e.movementX * .0022; player.pitch = Math.max(-1.3, Math.min(1.3, player.pitch - e.movementY * .0022));
});
let typer = 0;
function chooseDiff(k) { dif = DIFFS[k]; clearInterval(typer); st = 'boot'; initAudio(); } // button click = user gesture for mic + audio
function showMenu() {
  const story = 'Facility Sector 4 is compromised. The entity is blind, but its hearing is absolute. Every whisper, every intake of breath, every heartbeat is a data point leading it to your coordinates. Stay silent. Stay hidden. Extract before the frequency drops.';
  const o = $('ov'); o.style.display = 'flex';
  o.innerHTML = '<div id="logo">HUSH: THE FREQUENCY TRAP</div><div id="story"></div><div id="diffs">' +
    '<button class="dbtn" data-d="low" style="color:#00ff66">[ 🟢 LOW / RECRUIT ]<span>Forgiving noise floor. Slower entity.</span></button>' +
    '<button class="dbtn" data-d="med" style="color:#ffd23a">[ 🟡 MEDIUM / STANDARD ]<span>Balanced sensitivity. Standard entity.</span></button>' +
    '<button class="dbtn" data-d="high" style="color:#ff2a3d">[ 🔴 HIGH / HARDCORE ]<span>Ultra-sensitive floor. Fast entity. 3.5s locker window.</span></button></div>' +
    '<small>Microphone required. Headphones recommended. Pick a mode to begin calibration.</small>';
  o.querySelectorAll('.dbtn').forEach(b => b.onclick = () => chooseDiff(b.dataset.d));
  let i = 0; const el = $('story');
  typer = setInterval(() => { i = Math.min(story.length, i + 2); el.textContent = story.slice(0, i) + (i < story.length ? '\u2588' : ''); if (i >= story.length) clearInterval(typer); }, 22);
}
function showReady() {
  $('ov').innerHTML = 'CALIBRATION COMPLETE<small>DIFFICULTY: ' + dif.tag + '<br>WASD move. Mouse look. Shift = sneak. Space = throw decoy bolt. E = hide in locker / use terminal / call elevator. M = map (does not pause). Lasers and glass are loud. Stay quiet.' +
    (micOK ? '' : '<br><br>MICROPHONE UNAVAILABLE (' + micErr + '). Hold N to simulate noise instead.') + '</small><button id="go">ENTER FACILITY</button>';
  $('go').onclick = () => { $('ov').style.display = 'none'; lock(); startGame(); };
}
function calibText() {
  if (st !== 'boot' && st !== 'calib') return;
  const sub = st === 'boot' ? 'AWAITING MICROPHONE ACCESS...' : (micOK && actx.state !== 'running') ? 'CLICK ANYWHERE TO ENABLE AUDIO' :
    'MEASURING AMBIENT NOISE ' + Math.max(0, Math.ceil(3 - calT)) + 's' + (micOK ? '' : '<br>MICROPHONE UNAVAILABLE (' + micErr + '): hold N to simulate noise');
  $('ov').innerHTML = '[SYSTEM ONLINE: DO NOT SPEAK. CALIBRATING...]<small>' + sub + '</small>';
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); calibText(); render(); hud(); requestAnimationFrame(loop);
}
const SEGN = 36; $('segs').innerHTML = '<i></i>'.repeat(SEGN); const segEls = [...$('segs').children];
showMenu(); requestAnimationFrame(loop);
</script>
